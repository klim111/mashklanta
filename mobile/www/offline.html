<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משכלנתא</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f8fafc; font-family: Assistant, system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f172a; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(15,23,42,.08);
    padding: 28px 24px; margin: 16px; max-width: 360px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #475569; margin: 0 0 20px; line-height: 1.5; }
  button { width: 100%; border: 0; background: #2563eb; color: #fff; font: inherit; font-weight: 600;
    border-radius: 10px; padding: 12px 16px; }
</style>
</head>
<body>
<div class="card">
  <img src="icon.png" alt="">
  <h1>אין חיבור לאינטרנט</h1>
  <p>משכלנתא צריכה חיבור כדי להציג את הנתונים שלכם. בדקו את החיבור ונסו שוב.</p>
  <button type="button" onclick="retry()">נסו שוב</button>
</div>
<script>
  // חוזרים לאתר עצמו — הכתובת שהאפליקציה טוענת (server.url ב-capacitor.config.ts)
  function retry() { window.location.href = 'https://mashkalanta.com/'; }
  window.addEventListener('online', retry);
</script>
</body>
</html>
