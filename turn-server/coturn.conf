# TURN server configuration for Mashklanta Video Calls
# This configuration is optimized for low latency and high reliability

# Listening ports
listening-port=3478
tls-listening-port=5349

# External IP (will be set dynamically in deployment)
external-ip=EXTERNAL_IP_PLACEHOLDER

# Relay ports range
min-port=49152
max-port=65535

# Authentication
use-auth-secret
static-auth-secret=TURN_SECRET_PLACEHOLDER

# Realm
realm=mashklanta.com

# Logging (use stdout for Docker - logs go to docker logs)
# log-file=/var/log/coturn.log
verbose

# Security settings
fingerprint
lt-cred-mech

# Performance optimizations
total-quota=100
user-quota=50
max-bps=1000000

# Protocol settings
no-tcp-relay
no-tls
no-dtls

# Mobility
mobility

# Allow loopback peers (for testing)
allow-loopback-peers

# Deny private IP ranges (security)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

# Allow specific ranges if needed for internal networks
# no-loopback-peers
# no-multicast-peers

# Database settings (optional - for persistent users)
# userdb=/var/lib/coturn/turndb

# Certificate paths (for TLS - optional)
# cert=/etc/ssl/certs/turn_server_cert.pem
# pkey=/etc/ssl/private/turn_server_pkey.pem

# Process settings (commented out for Docker - not needed in containers)
# proc-user=turnserver
# proc-group=turnserver

# Additional security
secure-stun
no-cli
